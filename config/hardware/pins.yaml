        pull: "n/a"
        notes: "HW_HAS_P2_CONTROLS=false. Placeholder value 0 in the legacy header is not a real assignment."
        source_files: [include/hardware/pins_esp32c3.hpp]
        confidence: confirmed
      - signal_name: p2x
        gpio: null
        direction: not_present
        active_level: "n/a"
        pull: "n/a"
        notes: "HW_HAS_P2_CONTROLS=false. Placeholder value 0 in the legacy header is not a real assignment."
        source_files: [include/hardware/pins_esp32c3.hpp]
        confidence: confirmed
      - signal_name: p2o
        gpio: null
        direction: not_present
        active_level: "n/a"
        pull: "n/a"
        notes: "HW_HAS_P2_CONTROLS=false. Placeholder value 0 in the legacy header is not a real assignment."
        source_files: [include/hardware/pins_esp32c3.hpp]
        confidence: confirmed
      - signal_name: pca9555_int0
        gpio: null
        direction: not_present
        active_level: "n/a"
        pull: "n/a"
        notes: "HW_HAS_EXPANDER_INTERRUPTS=false. Placeholder value 0 is not a real GPIO assignment."
        source_files: [include/hardware/pins_esp32c3.hpp]
        confidence: confirmed
      - signal_name: pca9555_int1
        gpio: null
        direction: not_present
        active_level: "n/a"
        pull: "n/a"
        notes: "HW_HAS_EXPANDER_INTERRUPTS=false. Placeholder value 0 is not a real GPIO assignment."
        source_files: [include/hardware/pins_esp32c3.hpp]
        confidence: confirmed
      - signal_name: pca9555_int2
        gpio: null
        direction: not_present
        active_level: "n/a"
        pull: "n/a"
        notes: "HW_HAS_EXPANDER_INTERRUPTS=false. Placeholder value 0 is not a real GPIO assignment."
        source_files: [include/hardware/pins_esp32c3.hpp]
        confidence: confirmed
      - signal_name: pca9555_int3
        gpio: null
        direction: not_present
        active_level: "n/a"
        pull: "n/a"
        notes: "HW_HAS_EXPANDER_INTERRUPTS=false. Placeholder value 0 is not a real GPIO assignment."
        source_files: [include/hardware/pins_esp32c3.hpp]
        confidence: confirmed
      - signal_name: usb_cc1
        gpio: null
        direction: not_present
        active_level: "n/a"
        pull: "n/a"
        notes: No live USB-C CC sense path exists on the current C3 firmware route.
        source_files: [include/hardware/pins_esp32c3.hpp, src/usb_cc_sense.cpp]
        confidence: confirmed
      - signal_name: usb_cc2
        gpio: null
        direction: not_present
        active_level: "n/a"
        pull: "n/a"
        notes: No live USB-C CC sense path exists on the current C3 firmware route.
        source_files: [include/hardware/pins_esp32c3.hpp, src/usb_cc_sense.cpp]
        confidence: confirmed
      - signal_name: 5v_en
        gpio: null
        direction: not_present
        active_level: high
        pull: none
        notes: The current C3 contract omits 5V rail control. `PIN_5V_EN=13` in the legacy header is stale residue.
        source_files: [include/hardware/pins_esp32c3.hpp, src/power_rail.cpp]
        confidence: conflicting
    wake_groups:
      any_wake: [p1_dpad_up, p1_dpad_left, p1_dpad_down, p1_dpad_right]
      deep_sleep_wake: [p1_dpad_up, p1_dpad_left, p1_dpad_down, p1_dpad_right]
      notes: Only the P1 d-pad is used for wake on C3.
