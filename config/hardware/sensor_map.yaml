schema_version: 1
default_variant: esp32s3

variants:
  esp32s3:
    launch_revision: v3_3
    launch_pcb_revision: "3.31"
    older_revisions_with_same_square_map: [v2, v3]
    sensor_count: 64
    read_path:
      driver_chain: Pca9555InputScan_to_Pca9555BoardInput
      bus: i2c
      i2c_default_clock_hz: 100000
      i2c_gpio: {sda: 3, scl: 4}
      interrupt_driven_supported: true
      interrupt_signals: [pca9555_int0, pca9555_int1, pca9555_int2, pca9555_int3]
      interrupt_gpios_by_revision:
        v3_3: [34, 38, 48, 39]
        v3: [34, 38, 48, 39]
        v2: [34, 12, 48, 11]
      full_read_on_boot: true
      full_read_on_resync: true
      expanders_per_successful_scan: 4
      full_read_on_any_expander_interrupt: true
      reconciliation_interval_after_success_ms: 50
      max_read_attempts: 4
      reset_after_consecutive_failures: 2
      normal_runtime_sensor_period_ms: {ordinary: 5, cpu_thinking: 10, ota: 20}
    expander_addresses: ["0x20", "0x21", "0x22", "0x23"]
    raw_square_index_basis: 0=a8_to_63=h1
    polarity:
      expander_direction: inputs_all
      expander_polarity: inverted_all
      occupied_condition: bit_(15-pin)_set_after_read
    square_to_device_bit_mapping:
