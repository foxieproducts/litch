; Example PlatformIO configuration.
; Adjust `board`/`platform`/`framework` for your target.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
  bblanchon/ArduinoJson@^6.21.5

; LittleFS is typically provided by the core/framework for ESP32.
; If your platform requires additional config to enable LittleFS, add it here.
