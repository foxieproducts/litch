; Litch firmware
;
; Targets:
; - native: deterministic tests and production-equivalent VirtualLitch
; - litch-esp32c3: legacy prototype, selected explicitly
; - litch-esp32s3: ESP32-S3, including V3.3 and V3.31 launch boards
;
; Keep this minimal. Add libs only when needed.


[platformio]
default_envs = litch-esp32s3

[env]

[env:native]
platform = platformio/native@1.2.1
build_type = debug
test_build_src = true
test_filter = test_all_native
test_framework = custom
extra_scripts =
  pre:tools/pio/verify_litch_max.py
  pre:tools/pio/generate_test_all_native.py
  pre:tools/pio/generate_test_all_native_foxie.py
build_flags =
  -std=gnu++17
  -D LITCH_NATIVE=1
  -I test/include
  -I test/test_current_game_log_render_lease/sdk

lib_deps =
  bblanchon/ArduinoJson@6.21.5

; Keep native builds strict-ish
build_unflags =
  -std=gnu++11


[env:litch-esp32c3]
platform = platformio/espressif32@6.12.0
platform_packages =
  platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
board = litch_esp32c3
framework = arduino
board_build.flash_mode = qio
board_build.partitions = tools/partitions/partitions-4MB-c3-usb.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters =
  esp32_exception_decoder
build_type = release
build_flags =
  -std=gnu++17
  -flto
  -fno-exceptions
  -D LITCH_ESP32=1
  -D LITCH_BLE=1
  -D LITCH_TRACE=1
  -D LITCH_RELEASE_PROFILE=1
  -D LITCH_EDGE_LED_COUNT=0

build_unflags =
  -std=gnu++11
  -fno-lto
  -fexceptions

lib_deps =
  bblanchon/ArduinoJson@6.21.5
  makuna/NeoPixelBus@2.8.4
  h2zero/NimBLE-Arduino@2.3.7

; V1/C3 does not link peer verification. Keep the Arduino WiFi/IP wrapper out.
lib_ignore =
  WiFi

; upload_port = /dev/cu.usbmodem1101
; monitor_port = /dev/cu.usbmodem1101
; test_port = /dev/cu.usbmodem1101

[env:litch-esp32s3]
platform = platformio/espressif32@6.12.0
platform_packages =
  platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
board = litch_esp32s3
framework = arduino
board_build.flash_mode = qio
board_build.partitions = tools/partitions/partitions-8MB-ota-spiffs.csv
board_build.filesystem = littlefs
; Raw PlatformIO upload blindly replaces the installed partition table.
; ./litch flash binds one exact board and preserves its saved-data layout.
extra_scripts =
  pre:tools/pio/verify_litch_max.py
  pre:tools/pio/guard_s3_upload.py
  pre:tools/pio/capture_firmware_relink.py
  pre:tools/pio/harden_nimble_repeat_pairing.py
  pre:tools/pio/optimize_litch_max_evaluation.py
monitor_speed = 115200
monitor_filters =
  esp32_exception_decoder
build_type = release
build_flags =
  -std=gnu++17
  -D LITCH_ESP32=1
  -D LITCH_ESP32S3=1
  -D LITCH_OWNER_PAIRING=1
  -D LITCH_BLE=1
  -D LITCH_BLE_OTA=1
  ; Measured app reconnect uses ~4 KiB before SDK guards; reserve another 4 KiB.
  -D CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
  ; Six retained notification subscriptions for each of three saved phones.
  -D CONFIG_BT_NIMBLE_MAX_BONDS=3
  -D CONFIG_BT_NIMBLE_MAX_CCCDS=18
  -D MYNEWT_VAL_BLE_STORE_MAX_CSFCS=3
  -D LITCH_TRACE=1
  -D LITCH_RELEASE_PROFILE=1
  -D LITCH_HW_VARIANT_S3=1
  -D LITCH_EDGE_LED_COUNT=32
  -Wl,-u,litch_boot_policy_descriptor
  -Wl,--wrap=app_main
  -Wl,--wrap=initArduino
  -Wl,--wrap=esp_restart_noos
  -Wl,--wrap=tinyusb_init
  -Wl,--wrap=dcd_event_handler
  -Wl,--wrap=dcd_init
  -Wl,--wrap=dcd_connect
  -Wl,--wrap=tud_disconnect
  -Wl,--wrap=tud_connect
  -Wl,--wrap=tud_mount_cb
  -Wl,--wrap=cdcd_control_xfer_cb
  -Wl,--wrap=dcd_edpt_clear_stall
  -Wl,--wrap=dcd_edpt_xfer
  -Wl,--wrap=dcd_int_enable
  -Wl,--wrap=esp_intr_alloc
  -Wl,--wrap=xQueueGenericSend
  -Wl,--wrap=xQueueGenericSendFromISR
  -Wl,--wrap=esp_partition_read
  -Wl,--wrap=esp_partition_write
  -Wl,--wrap=esp_partition_erase_range

build_unflags =
  -std=gnu++11

lib_deps =
  bblanchon/ArduinoJson@6.21.5
  makuna/NeoPixelBus@2.8.4
  h2zero/NimBLE-Arduino@2.3.7

; Factory verification is BLE-only; exclude the unused Arduino WiFi wrapper.
lib_ignore =
  WiFi

; Temporary private-ABI capture; release environment does not link the hook.
[env:litch-esp32s3-panic-capture]
extends = env:litch-esp32s3
extra_scripts =
  ${env:litch-esp32s3.extra_scripts}
  post:tools/pio/panic_capture_link.py
build_flags =
  ${env:litch-esp32s3.build_flags}
  -D LITCH_PANIC_DIAGNOSTIC=1
  -D LITCH_BOOT_ENTRY_DIAGNOSTIC=1
  ; Fresh private trial token. Never reuse it to date a later trial.
  -D LITCH_BOOT_ENTRY_TOKEN=0xec3bce01
  -Wl,-e,litch_diagnostic_entry
  -Wl,--wrap=esp_panic_handler
  -Wl,--script=tools/pio/panic_diagnostic.ld

; Private host observation only; inherits the standard host allocation.
[env:litch-esp32s3-host-budget]
extends = env:litch-esp32s3-panic-capture
build_flags =
  ${env:litch-esp32s3-panic-capture.build_flags}
  -D LITCH_NIMBLE_HOST_BUDGET_DIAGNOSTIC=1
