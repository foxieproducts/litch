import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

import java.nio.file.Files
import java.nio.file.StandardOpenOption
import java.security.DigestInputStream
import java.security.MessageDigest

// Run only as an explicit offline release evidence refresh.
if (!gradle.startParameter.offline) {
    throw new GradleException('Android release runtime capture requires --offline')
}
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) {
        return
    }
    app.tasks.register('captureReleaseRuntimeInventory') {
        doLast {
            def output = app.findProperty('androidRuntimeInventoryOutput')
            if (!output || !new File(output).absolute) {
                throw new GradleException('Use -PandroidRuntimeInventoryOutput=<absolute new file>')
            }
            if (app.hasProperty('target-platform') || app.hasProperty('local-engine-repo')) {
                throw new GradleException('Capture requires the default release ABIs and published Flutter engine')
            }

            def androidRoot = app.rootProject.projectDir
            def repoRoot = androidRoot.parentFile.parentFile
            if (new File(repoRoot, 'app/pubspec_overrides.yaml').exists()) {
                throw new GradleException('Android release runtime capture requires app dependencies without local Pub overrides')
            }
            def properties = new Properties()
            new File(androidRoot, 'local.properties').withInputStream { properties.load(it) }
            def flutter = new JsonSlurper().parse(
                new File(properties.getProperty('flutter.sdk'), 'bin/cache/flutter.version.json')
            )
            def inputPaths = [
                'app/android/app/build.gradle.kts',
                'app/android/build.gradle.kts',
                'app/android/gradle.properties',
                'app/android/gradle/wrapper/gradle-wrapper.properties',
                'app/android/settings.gradle.kts',
                'app/pubspec.lock',
                'app/pubspec.yaml',
                'app/third_party/flutter_reactive_ble/pubspec.yaml',
                'app/third_party/reactive_ble_mobile/android/build.gradle',
                'app/third_party/reactive_ble_mobile/pubspec.yaml',
            ]
            def inputs = inputPaths.collectEntries { path ->
                def content = new File(repoRoot, path).getText('UTF-8').replace('\r\n', '\n').replace('\r', '\n')
                if (path == 'app/pubspec.yaml') {
                    content = content.replaceFirst(/(?m)^version:[^\n]*\n?/, '')
                }
                [(path): MessageDigest.getInstance('SHA-256').digest(content.getBytes('UTF-8')).encodeHex().toString()]
            }

            def configuration = app.configurations.getByName('releaseRuntimeClasspath')
            def resolution = configuration.incoming.resolutionResult
            def unresolved = resolution.allDependencies.find { it instanceof UnresolvedDependencyResult }
            if (unresolved) {
                throw new GradleException("Unresolved Android release dependency: ${unresolved.attempted}", unresolved.failure)
            }

            def artifacts = [:].withDefault { new TreeMap() }
            def view = configuration.incoming.artifactView {
                componentFilter { it instanceof ModuleComponentIdentifier }
            }
            view.artifacts.artifacts.each { artifact ->
                def digest = MessageDigest.getInstance('SHA-256')
                artifact.file.withInputStream { stream ->
                    new DigestInputStream(stream, digest).transferTo(OutputStream.nullOutputStream())
                }
                def files = artifacts[artifact.id.componentIdentifier]
                def sha256 = digest.digest().encodeHex().toString()
                def prior = files.put(artifact.file.name, sha256)
                if (prior && prior != sha256) {
                    throw new GradleException("Conflicting artifacts for ${artifact.id}")
                }
            }

            def modules = resolution.allComponents.findAll { it.id instanceof ModuleComponentIdentifier }
                .sort { it.id.displayName }
                .collect { component ->
                    [
                        coordinate: component.id.displayName,
                        parents: component.dependents.collect { it.from.id.displayName }.unique().sort(),
                        artifacts: artifacts[component.id],
                    ]
                }
            if (modules.empty) {
                throw new GradleException('Android release runtime resolved no Maven components')
            }
            def inventory = [
                schema: 'litch-android-runtime-v1',
                configuration: "${app.path}:${configuration.name}",
                gradle_version: gradle.gradleVersion,
                flutter_version: flutter.frameworkVersion,
                inputs: inputs,
                modules: modules,
            ]
            def json = JsonOutput.prettyPrint(JsonOutput.toJson(inventory))
                .replaceAll(/\{\n[ \t]*\n[ \t]*\}/, '{}')
            Files.writeString(new File(output).toPath(), json + '\n', StandardOpenOption.CREATE_NEW)
        }
    }
}
